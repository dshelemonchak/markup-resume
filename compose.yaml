# Development environment. Usage:
#   docker compose up -d dev                     start the toolbox container
#   docker compose exec dev pnpm install         install dependencies
#   docker compose exec dev pnpm seed            put the template's example CV into ./data
#   docker compose exec dev pnpm check           lint, format, typecheck, tests
#   docker compose up -d app                     API on http://localhost:3000/api/v1
#   docker compose up web                        Angular dev server on http://localhost:4200 (proxies /api to app)
#   docker compose run --rm -T mcp               MCP server on stdio, started by Claude (see .mcp.json)
# A database service is added when a database adapter exists (ADR-0012).

# The project name, so containers and the network are named after the product whatever the folder is called.
name: markup-resume

x-workspace: &workspace
  build:
    context: .
    target: dev
  image: markup-resume:dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - ./data:/data
  environment:
    CV_DATA_DIR: /data
  # Chromium needs more shared memory than Docker's 64 MB default.
  shm_size: 1gb

services:
  dev:
    <<: *workspace

  app:
    <<: *workspace
    command: pnpm --filter @markup-resume/app dev
    environment:
      CV_DATA_DIR: /data
      PORT: '3000'
      # Where the project lives on the host, for the "Connect Claude" hint in the UI.
      # PWD is the folder compose was started from, normally the project folder.
      HOST_PROJECT_DIR: ${PWD:-}
    ports:
      - '3000:3000'

  web:
    <<: *workspace
    command: pnpm --filter @markup-resume/web start --host 0.0.0.0 --port 4200
    depends_on:
      - app
    ports:
      - '4200:4200'

  # MCP server for Claude (ADR-0003). Not started by `up`: Claude runs it per session with
  #   docker compose run --rm -T mcp
  # -T: no pseudo-TTY, which would rewrite line endings and break JSON-RPC on stdout.
  # Claude Code picks it up from .mcp.json. Claude Desktop installs it as the markup-resume.mcpb
  # extension from the UI's "Connect Claude" dialog. The dialog also explains a manual entry for
  # Settings → Developer → Edit Config, with absolute paths because GUI apps start without your
  # shell's PATH or working directory:
  #   "mcpServers": { "markup-resume": {
  #     "command": "<output of `which docker`>",
  #     "args": ["compose", "--project-directory", "/absolute/path/to/markup-resume", "run", "--rm", "-T", "mcp"] } }
  mcp:
    <<: *workspace
    profiles: [mcp]
    environment:
      CV_DATA_DIR: /data
      # Holds a presence connection to the app so the UI shows Claude as connected (ADR-0018).
      # The app may be down; the MCP server works the same and reconnects when it is up.
      CV_APP_URL: http://app:3000
    command: node packages/app/src/mcp.ts
    stdin_open: true
