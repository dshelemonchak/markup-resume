# Development environment. Usage:
#   docker compose up -d dev                     start the toolbox container
#   docker compose exec dev pnpm install         install dependencies
#   docker compose exec dev pnpm seed            put the template's example CV into ./data
#   docker compose exec dev pnpm check           lint, format, typecheck, tests
#   docker compose up -d app                     API on http://localhost:3000/api/v1, MCP for Claude on /mcp
#   docker compose up web                        Angular dev server on http://localhost:4200 (proxies /api to app)
# A database service is added when a database adapter exists (ADR-0012).

# The project name, so containers and the network are named after the product whatever the folder is called.
name: markup-resume

x-workspace: &workspace
  build:
    context: .
    target: dev
  image: markup-resume:dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - ./data:/data
  environment:
    # Where pnpm import:files reads CVs that an earlier version kept as files.
    LEGACY_RESUME_DIR: /data
    # The dev toolbox reaches the database too, e.g. to generate table types (pnpm db:types).
    DATABASE_URL: postgres://markup:markup@db:5432/markup
    # Whose CVs pnpm seed, import:files and claim:local-resumes act for (ADR-0027), from .env.
    OWNER_GITHUB_ID: ${OWNER_GITHUB_ID:-}
  # Chromium needs more shared memory than Docker's 64 MB default.
  shm_size: 1gb

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: markup
      POSTGRES_PASSWORD: markup
      POSTGRES_DB: markup
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markup -d markup']
      interval: 2s
      timeout: 3s
      retries: 15

  dev:
    <<: *workspace

  app:
    <<: *workspace
    command: pnpm --filter @markup-resume/app dev
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://markup:markup@db:5432/markup
      # GitHub sign-in (ADR-0027), from a dev OAuth App; the values come from .env, which git ignores.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Where the user's browser opens the app: the GitHub callback and the Origin check use it.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4200}
      # The public URL of the MCP endpoint (ADR-0028): https needs OAuth; http on localhost is a local run, where
      # MCP acts for OWNER_GITHUB_ID.
      MCP_URL: ${MCP_URL:-http://localhost:3000/mcp}
      OWNER_GITHUB_ID: ${OWNER_GITHUB_ID:-}
      # Comma-separated GitHub user ids that may sign in; empty lets anyone in, which an https MCP_URL refuses.
      ALLOWED_GITHUB_IDS: ${ALLOWED_GITHUB_IDS:-}
    ports:
      # This machine only: in a local run, MCP trusts whoever reaches it (ADR-0028).
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *workspace
    command: pnpm --filter @markup-resume/web start --host 0.0.0.0 --port 4200
    depends_on:
      - app
    ports:
      - '4200:4200'

  # The Java server's toolbox: docker compose run --rm java ./mvnw verify. Testcontainers starts its own Postgres
  # through the host's Docker socket.
  java:
    image: eclipse-temurin:25-jdk
    profiles: [java]
    working_dir: /workspace/server
    volumes:
      - .:/workspace
      - java-m2:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway

  # The Java server on the same database as app: docker compose up app-java, then http://localhost:3001/api/health.
  app-java:
    build:
      context: .
      target: server
    image: markup-resume:server
    profiles: [java]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/markup
      SPRING_DATASOURCE_USERNAME: markup
      SPRING_DATASOURCE_PASSWORD: markup
    ports:
      - '127.0.0.1:3001:8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  java-m2:
    name: markup-resume-java-m2
  db-data:
    name: markup-resume-db
    labels:
      com.markup-resume.purpose: database
