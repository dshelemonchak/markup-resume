# Development environment. Usage:
#   docker compose up -d dev                     start the toolbox container
#   docker compose exec dev pnpm install         install dependencies
#   docker compose exec dev pnpm seed            put the template's example CV into ./data
#   docker compose exec dev pnpm check           lint, format, typecheck, tests
#   docker compose up -d app                     API on http://localhost:3000/api/v1, MCP for Claude on /mcp
#   docker compose up web                        Angular dev server on http://localhost:4200 (proxies /api to app)
# A database service is added when a database adapter exists (ADR-0012).

# The project name, so containers and the network are named after the product whatever the folder is called.
name: markup-resume

x-workspace: &workspace
  build:
    context: .
    target: dev
  image: markup-resume:dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - ./data:/data
  environment:
    # Where pnpm import:files reads CVs that an earlier version kept as files.
    LEGACY_RESUME_DIR: /data
    # The dev toolbox reaches the database too, e.g. to generate table types (pnpm db:types).
    DATABASE_URL: postgres://markup:markup@db:5432/markup
  # Chromium needs more shared memory than Docker's 64 MB default.
  shm_size: 1gb

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: markup
      POSTGRES_PASSWORD: markup
      POSTGRES_DB: markup
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markup -d markup']
      interval: 2s
      timeout: 3s
      retries: 15

  dev:
    <<: *workspace

  app:
    <<: *workspace
    command: pnpm --filter @markup-resume/app dev
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://markup:markup@db:5432/markup
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *workspace
    command: pnpm --filter @markup-resume/web start --host 0.0.0.0 --port 4200
    depends_on:
      - app
    ports:
      - '4200:4200'

volumes:
  db-data:
    name: markup-resume-db
    labels:
      com.markup-resume.purpose: database
