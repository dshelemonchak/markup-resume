name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ci
          push: 'false'
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tests against a real Postgres (pnpm test:db), in the same Compose stack as local development.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Postgres
        run: docker compose up --detach --wait db
      # As root: the checkout belongs to the runner's user, not to the image's node user.
      - name: Install dependencies
        run: docker compose run --rm --user root dev pnpm install --frozen-lockfile
      - name: Database tests
        run: docker compose run --rm --user root dev pnpm test:db
