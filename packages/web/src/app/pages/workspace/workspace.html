<mr-sidebar
  class="sidebar"
  [items]="cvs()"
  [listState]="listState()"
  [selectedId]="selectedId()"
  (selectCv)="selectedId.set($event)"
  [claude]="claudeStatus()"
  (connectClaude)="connectClaude.open()"
/>
<mr-export-report
  [problems]="exportProblems()"
  [failure]="exportFailure()"
  (downloadAnyway)="exportPdf(true)"
/>
<mr-connect-claude #connectClaude [sessions]="claudeSessionLines()" />
<div
  class="document-column"
  mrPinchZoom
  [(zoom)]="zoom"
  [scale]="documentInfo()?.scale ?? 1"
  [style.--mr-header-height.px]="headerHeight()"
  [style.--mr-footer-height.px]="footerHeight()"
>
  <mr-document-header
    class="header"
    [cv]="selectedCv()"
    [(mode)]="mode"
    [exporting]="exporting()"
    (exportPdf)="exportPdf()"
  />
  <main class="document-area">
    @if (documentSrc(); as src) {
      <mr-document-canvas
        [src]="src"
        [mode]="mode()"
        [(zoom)]="zoom"
        (documentInfo)="documentInfo.set($event)"
      />
    } @else if (listState() === 'loading') {
      <p class="empty">{{ 'workspace.loading' | transloco }}</p>
    } @else if (listState() === 'unreachable') {
      <p class="empty" [innerHTML]="'workspace.unreachable' | transloco"></p>
    } @else if (listState() === 'failed') {
      <p class="empty" [innerHTML]="'workspace.failed' | transloco"></p>
    } @else {
      <p class="empty" [innerHTML]="'workspace.empty' | transloco"></p>
    }
  </main>
  <mr-document-footer
    class="footer"
    [info]="documentSrc() ? documentInfo() : null"
    [mode]="mode()"
    [(zoom)]="zoom"
  />
</div>
