<cvc-sidebar
  class="sidebar"
  [items]="cvs()"
  [selectedId]="selectedId()"
  (selectCv)="selectedId.set($event)"
  (connectClaude)="connectClaude.open()"
/>
<cvc-connect-claude #connectClaude [projectDir]="hostProjectDir()" />
<div
  class="document-column"
  cvcPinchZoom
  [(zoom)]="zoom"
  [scale]="documentInfo()?.scale ?? 1"
  [style.--cvc-header-height.px]="headerHeight()"
  [style.--cvc-footer-height.px]="footerHeight()"
>
  <cvc-document-header class="header" [cv]="selectedCv()" [(mode)]="mode" />
  <main class="document-area">
    @if (documentSrc(); as src) {
      <cvc-document-canvas
        [src]="src"
        [mode]="mode()"
        [(zoom)]="zoom"
        (documentInfo)="documentInfo.set($event)"
      />
    } @else if (loadError()) {
      <p class="empty">
        The local server is not reachable. Start it with <code>docker compose up -d app</code>.
      </p>
    } @else {
      <p class="empty">
        No CVs yet. Add one to <code>data/cvs/&lt;id&gt;/document.html</code> or run <code>pnpm seed</code>.
      </p>
    }
  </main>
  <cvc-document-footer
    class="footer"
    [info]="documentSrc() ? documentInfo() : null"
    [mode]="mode()"
    [(zoom)]="zoom"
  />
</div>
