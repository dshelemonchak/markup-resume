<section cvc-glass-panel class="card-example" aria-labelledby="glass-panel-title">
  <h2 id="glass-panel-title" class="h5">Glass panel</h2>
  <p class="text-body-secondary">
    Large surface for the sidebar, the toolbar and the status bar. Every panel takes its look from this one
    component.
  </p>
  <div class="d-flex gap-2">
    <button type="button" class="btn btn-primary btn-sm">Primary action</button>
    <button type="button" class="btn btn-outline-secondary btn-sm">Secondary</button>
  </div>
</section>

<div cvc-glass-panel variant="compact" class="pill-example" role="group" aria-label="Zoom">
  <button type="button" class="btn btn-sm" aria-label="Zoom out">−</button>
  <span class="zoom-level">100%</span>
  <button type="button" class="btn btn-sm" aria-label="Zoom in">+</button>
</div>
