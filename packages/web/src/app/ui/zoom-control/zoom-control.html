<button
  type="button"
  class="segment"
  [attr.aria-label]="'zoom.out' | transloco"
  [disabled]="!canZoomOut()"
  (click)="zoomOut()"
>
  <i class="bi bi-dash-lg" aria-hidden="true"></i>
</button>
<button
  type="button"
  class="segment level"
  [attr.aria-label]="'zoom.level' | transloco"
  (click)="resetZoom()"
>
  {{ percent() }}%
</button>
<button
  type="button"
  class="segment"
  [attr.aria-label]="'zoom.in' | transloco"
  [disabled]="!canZoomIn()"
  (click)="zoomIn()"
>
  <i class="bi bi-plus-lg" aria-hidden="true"></i>
</button>
<button type="button" class="segment fit" [attr.aria-pressed]="zoom() === 'fit'" (click)="fit()">
  {{ 'zoom.fit' | transloco }}
</button>
