<header mr-glass-panel class="toolbar">
  <div class="segmented" role="group" [attr.aria-label]="'header.view' | transloco">
    <input
      type="radio"
      class="btn-check"
      name="preview-mode"
      id="preview-mode-visual"
      [checked]="mode() === 'visual'"
      (change)="mode.set('visual')"
    />
    <label class="segment" for="preview-mode-visual">{{ 'header.visual' | transloco }}</label>
    <input
      type="radio"
      class="btn-check"
      name="preview-mode"
      id="preview-mode-ats"
      [checked]="mode() === 'ats'"
      (change)="mode.set('ats')"
    />
    <label class="segment" for="preview-mode-ats">{{ 'header.ats' | transloco }}</label>
  </div>

  @if (resume(); as resume) {
    <!-- The title is the selected row in the CV list; here it names the page for assistive technology. -->
    <h1 class="visually-hidden">{{ resume.title }}</h1>
    @if (badge(); as badge) {
      <span class="chip" [class]="badge.css">{{ badge.key | transloco }}</span>
    }
    <span class="showing">
      {{ 'header.showing' | transloco }}
      <span class="file">{{ resume.slug }}.html</span>
    </span>
  } @else {
    <h1 class="empty-title">{{ 'header.noCv' | transloco }}</h1>
  }

  <button
    type="button"
    class="btn btn-primary export"
    [disabled]="!resume() || exporting()"
    (click)="exportPdf.emit()"
  >
    @if (exporting()) {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      {{ 'header.exporting' | transloco }}
    } @else {
      {{ 'header.export' | transloco }}
    }
  </button>
</header>
