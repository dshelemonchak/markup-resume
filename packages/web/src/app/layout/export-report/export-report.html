<dialog #dialog class="dialog" closedby="any" aria-labelledby="export-report-title">
  <div class="content">
    <div class="head">
      <h2 id="export-report-title" class="title">
        {{ (failure() ? 'exportReport.title.failed' : 'exportReport.title.problems') | transloco }}
      </h2>
      <button
        type="button"
        class="btn btn-sm close"
        [attr.aria-label]="'dialog.close' | transloco"
        (click)="close()"
      >
        <i class="bi bi-x-lg" aria-hidden="true"></i>
      </button>
    </div>

    @if (failure(); as failure) {
      <p class="intro" [innerHTML]="'exportReport.intro.failed' | transloco"></p>
      <p class="failure">{{ failure }}</p>
    } @else {
      <p class="intro">{{ 'exportReport.intro.problems' | transloco }}</p>
      <ul class="problems">
        @for (line of lines(); track $index) {
          <li>{{ line }}</li>
        }
      </ul>
    }

    <div class="actions">
      @if (!failure()) {
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="download()">
          {{ 'exportReport.downloadAnyway' | transloco }}
        </button>
      }
      <button type="button" class="btn btn-primary btn-sm" (click)="close()">
        {{ 'dialog.close' | transloco }}
      </button>
    </div>
  </div>
</dialog>
